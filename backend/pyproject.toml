[project]
name = "assistant-harness-backend"
version = "0.1.0"
description = "个人助手 harness 后端（FastAPI + SQLite）"
requires-python = ">=3.12"
dependencies = [
    # Web 框架与 ASGI 服务器
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # ORM 与数据库
    "sqlalchemy>=2.0",
    # LLM 接入（Anthropic 兼容 API，流式）
    "anthropic>=0.40",
    # .env 配置加载（与 mini_harness 一致的做法）
    "python-dotenv>=1.0",
    # 链路追踪（默认关闭，LANGFUSE_ENABLED 控制）
    "langfuse>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    # FastAPI TestClient 依赖 httpx
    "httpx>=0.27",
]
